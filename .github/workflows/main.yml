name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4
      - uses: actions/checkout@v4

      # Updated Node setup to v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Java setup (Android build ke liye zaroori hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Build Steps with required permissions
      - name: Build Capacitor APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "Drifter Star" "com.vishnu.drifterstar" --web-dir .
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload Artifact (Debug APK easily install ho jata hai)
      - uses: actions/upload-artifact@v4
        with:
          name: Clean-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

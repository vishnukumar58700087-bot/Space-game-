# 4. Build & Compile Process
      - name: Build Capacitor APK
        run: |
          # Step 1: HTML, CSS, JS फाइलों के लिए www फोल्डर बनाएं
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.json" \) -not -name "package*.json" -exec cp {} www/ \;

          # Safety Check: Capacitor sync fail na ho, isliye agar index.html nahi hai toh ek dummy file bana lein
          if [ ! -f www/index.html ]; then echo "<html><body>App Loaded</body></html>" > www/index.html; fi

          # Step 2: Capacitor इनिशियलाइज़ और सेटअप करें
          if [ ! -f package.json ]; then npm init -y; fi

          npm install @capacitor/core @capacitor/android @capacitor/cli

          # Sirf tabhi init karo jab pehle se config file na ho (crash rokne ke liye)
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Drifter Star" "com.vishnu.drifterstar" --web-dir www
          fi

          # Step 3: Android प्लेटफॉर्म जोड़ें और सिंक करें
          npx cap add android
          npx cap sync android

          # Step 4: APK बिल्ड करें
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          ./gradlew assembleDebug

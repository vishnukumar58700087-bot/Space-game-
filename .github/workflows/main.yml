name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Capacitor APK
        run: |
          # 1. HTML, CSS, JS फाइलों के लिए www फोल्डर बनाएं
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.json" \) -not -name "package*.json" -exec cp {} www/ \;
          
          # Safety Check: Capacitor sync fail ना हो, इसलिए index.html ना होने पर बना लेगा
          if [ ! -f www/index.html ]; then echo "<html><body>App Loaded</body></html>" > www/index.html; fi
          
          # 2. Capital letter वाला Error Fix
          if [ ! -f package.json ]; then echo '{"name": "drifter-star-app", "version": "1.0.0"}' > package.json; fi
          
          # 3. Capacitor और Dependencies इंस्टॉल करें
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "Drifter Star" "com.vishnu.drifterstar" --web-dir www --force
          
          # 4. Android प्लेटफॉर्म जोड़ें
          npx cap add android
          npx cap sync android
          
          # 5. APK बिल्ड करें
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          ./gradlew assembleDebug

      - name: Upload Clean Game APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

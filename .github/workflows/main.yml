name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Capacitor APK
        run: |
          # 1. HTML, CSS, JS फाइलों के लिए www फोल्डर बनाएं
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.json" \) -not -name "package*.json" -exec cp {} www/ \;
          
          # 2. Capacitor इनिशियलाइज़ और सेटअप करें
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "Drifter Star" "com.vishnu.drifterstar" --web-dir www
          
          # 3. Android प्लेटफॉर्म जोड़ें और सिंक करें
          npx cap add android
          npx cap sync android
          
          # 4. APK बिल्ड करें
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Clean-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
